server:
  port: 8123
  servlet:
    context-path: /api
#    cookie 30天后过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: cloud-picture-backend
  datasource:
     driver-class-name: com.mysql.cj.jdbc.Driver
     url: jdbc:mysql://localhost:3306/cloud_picture
     username: root
     password: 123456
#  redis配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
    password: 123456
#    session 配置
  session:
    store-type: redis
    timeout: 2592000 # session 30天后过期

  #    开放文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB

  # ShardingSphere 配置
  shardingsphere:
    datasource:
      names: cloud-picture
      cloud-picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/cloud_picture
        username: root
        password: 123456
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: cloud-picture.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.urim.cloudpicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true

#     mybatis-plus配置
mybatis-plus:
  configuration:
#    mybatis配置
    map-underscore-to-camel-case: false
#    仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    逻辑删除
  global-config:
    db-config:
      logic-delete-field: isDelete  # 如果你的字段名是 is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    enable-sql-runner: true
knife4j:
  enable: true
  openapi:
    title: 接口文档
    # aaa"
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.urim.cloudpicturebackend.controller

